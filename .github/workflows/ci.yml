# Quality gate: the production build, then accessibility and behaviour checks
# (Playwright + axe), Lighthouse budgets, and screenshot comparison against
# committed baselines.
#
# Runs on pull requests, by hand, and for every Vercel deployment through
# .github/workflows/deployment-checks.yml. In that case each job reports itself to
# Vercel as a commit status on the deployment's commit, and Vercel Deployment
# Checks hold a production deployment until both statuses pass.
#
# Lighthouse scores are kept across runs as a `lighthouse-history` artifact on each
# production check, and every run writes a trend table to its job summary.
name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.client_payload.git.sha || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      statuses: write
    steps:
      # First step on purpose: it reports pending now and the job's result when it ends.
      - name: Report to Vercel Deployment Checks
        if: github.event_name == 'repository_dispatch'
        uses: vercel/repository-dispatch/actions/status@30f760c6640485cd92f8c785ef361382555fb712 # v1
        with:
          name: 'Vercel - chad-kraus-portfolio: quality'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The deployment's commit; empty outside a Vercel event, which means the default.
          ref: ${{ github.event.client_payload.git.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Accessibility and behaviour (Playwright + axe)
        run: npm run test:e2e
      - name: Lighthouse budgets
        run: npx --yes @lhci/cli@0.15.1 autorun
      - name: Fetch the Lighthouse history from the latest production check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow deployment-checks.yml --status success --limit 15 --json databaseId --jq '.[].databaseId'); do
            gh run download "$id" --repo "$GITHUB_REPOSITORY" --name lighthouse-history --dir previous 2>/dev/null && break
          done
          true
      - name: Update the Lighthouse history and trend
        id: history
        env:
          COMMIT_SHA: ${{ github.event.client_payload.git.sha || github.sha }}
        run: node scripts/lighthouse-history.mjs previous/lighthouse-history.json lighthouse-history.json
      - name: Keep the Lighthouse history
        if: always() && steps.history.outcome != 'skipped' && github.event_name == 'repository_dispatch' && github.event.client_payload.environment == 'production'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-history
          path: lighthouse-history.json
          retention-days: 90
      - name: Keep the Playwright report when something fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  # Screenshot comparison, inside the pinned Playwright image the baselines were
  # rendered in (scripts/update-visual-baselines.sh), so fonts match exactly.
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      statuses: write
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 # v1.63.0-noble
      options: --ipc=host
    steps:
      # First step on purpose: it reports pending now and the job's result when it ends.
      - name: Report to Vercel Deployment Checks
        if: github.event_name == 'repository_dispatch'
        uses: vercel/repository-dispatch/actions/status@30f760c6640485cd92f8c785ef361382555fb712 # v1
        with:
          name: 'Vercel - chad-kraus-portfolio: visual'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The deployment's commit; empty outside a Vercel event, which means the default.
          ref: ${{ github.event.client_payload.git.sha }}
      - run: npm ci
      - run: npm run build
      - name: Screenshots against committed baselines
        run: npm run test:visual
        env:
          HOME: /root
      - name: Keep the diff images when screenshots change
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-diffs
          path: test-results/
          retention-days: 7
