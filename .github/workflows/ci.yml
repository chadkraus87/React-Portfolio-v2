# Quality gate on every push and pull request: the production build, then
# accessibility and behaviour checks (Playwright + axe), then Lighthouse budgets.
# A failure here marks the commit red. Vercel still deploys pushes to main on its
# own; to hold a failing build back from production, enable Deployment Checks for
# this workflow in the Vercel project settings.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Accessibility and behaviour (Playwright + axe)
        run: npm run test:e2e
      - name: Lighthouse budgets
        run: npx --yes @lhci/cli@0.15.1 autorun
      - name: Keep the Playwright report when something fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
