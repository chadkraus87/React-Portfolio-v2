name: Publish portfolio

# DISABLED: the site is deployed by Vercel now. This no longer runs on push,
# so GitHub Pages keeps serving the last build published from here rather than
# publishing a root-based build that would 404 on its assets.
# Still runnable by hand from the Actions tab if the old URL ever needs a
# rebuild — but note the Vite base is '/' now, which GitHub Pages cannot serve
# from a repo subpath.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install building blocks
        run: npm install

      - name: Build the site
        run: npm run build

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
