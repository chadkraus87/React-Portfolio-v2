# Once a day: whether each live demo still answers (src/data/uptime.json) and public
# commit activity (src/data/activity.json). Commits only when something changed;
# that push is what redeploys the site on Vercel. Also keeps two GitHub issues in
# step with reality: "Stale portfolio evidence" and "Live demo not answering".
#
# fetch-activity.mjs runs WITHOUT a token on purpose: the unauthenticated API can
# only see public repositories, so a private repo cannot leak into the heat map.
# Runners share an IP, so the anonymous rate limit is sometimes hit; that step then
# writes nothing and the rest of the job still runs.
name: Refresh activity

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Check that each live demo answers
        run: node scripts/check-uptime.mjs
      - name: Summarise where visits came from
        continue-on-error: true
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: node scripts/campaign-summary.mjs 30 >> "$GITHUB_STEP_SUMMARY"
      - name: Fetch public commit activity
        continue-on-error: true
        run: node scripts/fetch-activity.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/activity.json src/data/uptime.json; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/activity.json src/data/uptime.json
          git commit -m "chore: refresh public activity and demo uptime"
          git push origin HEAD:main
      - name: Sync the stale-evidence issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh scripts/sync-issue.sh "Stale portfolio evidence" \
            "These case studies show a screenshot or demo captured before the project's last update. Refresh the capture and its imageDate or demoDate in src/data/projects.js." \
            "$(node scripts/check-evidence.mjs)" \
            "All screenshots and demos are current again."
      - name: Sync the live-demo issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh scripts/sync-issue.sh "Live demo not answering" \
            "These live demo links did not answer the daily check (two tries, five seconds apart). The rack shows their power light in amber until they answer again." \
            "$(node scripts/check-uptime.mjs --report)" \
            "Every live demo answers again."
