<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Decodes the route that public/404.html encoded into the query string,
         restoring the real URL before React Router reads it. Must stay a plain
         inline script in <head>: module scripts are deferred, which would run
         this after the router has already read the wrong location. -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>

    <link rel="icon" type="image/svg+xml" href="/React-Portfolio-v2/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    />
