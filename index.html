<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Google Search Console ownership verification.
         IMPORTANT: each Search Console property gets its OWN token. A token
         issued for one property will not verify another, even on the same
         site — Search Console reports "meta tag is incorrect" in that case.
         Multiple tags are allowed, so add one line per property rather than
         replacing. The prerender step copies these into every route's HTML.
         Do not remove a tag while its property still exists: Search Console
         re-checks periodically and will un-verify if it disappears.

         Both tokens are served on both surfaces (this site and the redirect
         page on the old GitHub Pages URL) so either property verifies. -->
    <!-- current Search Console property -->
    <meta name="google-site-verification" content="DwyTiinbn3YIUQMFCfRHS4ANJOCJLArkvd37UhH7BB4" />
    <!-- older property on chadkraus87.github.io — safe to delete this line
         once that property is gone from Search Console -->
    <meta name="google-site-verification" content="sxPkNAn4lo3QOdLWZPryWY25Ve_R6wGP1x7qoS7aAAc" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Chadwick (Chad) Kraus — Network IT Specialist, QA Ops, and AI tooling practitioner. Building AI agents and full-stack applications with Claude Code."
    />
    <title>Chadwick (Chad) Kraus · Network IT · QA Ops · AI Tooling</title>

    <!-- Social preview (LinkedIn, Slack, iMessage, X). These URLs must be
         fully absolute — crawlers do not resolve relative paths reliably, so
         they are not left for Vite's base-path rewrite. If the site ever moves
         to a custom domain, update all three URLs below. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chadwick (Chad) Kraus" />
    <meta property="og:url" content="https://chad-kraus-portfolio.vercel.app/" />
    <meta property="og:title" content="Chadwick (Chad) Kraus · Network IT · QA Ops · AI Tooling" />
    <meta
      property="og:description"
      content="Network IT Specialist at Rockbot. Tier 2/3 escalations, QA operations, and AI tooling built with Claude Code — including Jarvis, PetCenza, and CoachRhythm."
    />
    <meta property="og:image" content="https://chad-kraus-portfolio.vercel.app/og-image.png" />
    <!-- Rendered at 2x (2400x1260) for retina headroom; still the 1.91:1 ratio
         LinkedIn and X expect, so it downscales cleanly. -->
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta
      property="og:image:alt"
      content="Chadwick (Chad) Kraus — Network IT Specialist at Rockbot"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Chadwick (Chad) Kraus · Network IT · QA Ops · AI Tooling" />
    <meta
      name="twitter:description"
      content="Network IT Specialist at Rockbot. Tier 2/3 escalations, QA operations, and AI tooling built with Claude Code."
    />
    <meta name="twitter:image" content="https://chad-kraus-portfolio.vercel.app/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- GoatCounter analytics. `no_onload` disables the script's own automatic
         pageview so it cannot double-count the landing page — src/components/
         Analytics.jsx records every view instead, passing the hash route as an
         explicit path so the four pages report separately. -->
    <script
      data-goatcounter="https://chadkraus.goatcounter.com/count"
      data-goatcounter-settings='{"no_onload": true}'
      async
      src="https://gc.zgo.at/count.js"
    ></script>
  </body>
</html>
